# Die Live-Suite gegen BISTA — wöchentlich, und sichtbar wenn sie fällt.
#
# WARUM ES DIESEN WORKFLOW GIBT
# -----------------------------
# `ci.yml` fährt `pytest tests/ -m "not live"`. Das ist richtig: Ein fremder
# 503 darf keinen fremden Pull Request rot machen, denn eine Suite, die das
# tut, wird abgeschaltet — und eine abgeschaltete Suite prüft nichts.
#
# Der Ausschluss erzeugt aber genau die Blindheit, gegen die die Live-Tests
# geschrieben wurden. `-m "not live"` ist kein Ort, an dem Tests laufen; es ist
# die Abwesenheit eines solchen. Und die drei Tests, die hier laufen, sind die
# einzigen im Repo, die einer falschen Grundannahme über BISTA widersprechen
# können: Jeder andere Test prüft gegen eine Fixture, und die Fixture ist aus
# derselben Annahme geschrieben wie der Code.
#
# Belegt, zweimal:
#
#   * 3.8.2026 — der Code las `r["Schulgemeinde"]`, BISTA lieferte
#     `schulgemeinde`. Vier von sechs Datensätzen, acht Tools, alle Unit-Tests
#     grün. Gemeldet hat es ein Live-Lauf von Hand, nicht die Suite.
#   * 7.8.2026 — `r.get("Total_19_Jahre_alt")` gegen eine Zeile, deren
#     Schlüssel der Fix vom 3.8. kleingeschrieben hatte. Die Spalte
#     «19-Jährige» stand seitdem in jeder Antwort auf «—». Gefunden hat es eine
#     externe Sonde gegen die Live-Quelle. Auch nicht die Suite.
#
# Dieser Workflow ist der Ort, an dem so etwas beim nächsten Mal auffällt.
#
# DREI ANTWORTEN, NICHT ZWEI
# --------------------------
# `if: failure()` allein kann nicht zwischen «ein Test ist rot» und «der Job
# kam gar nicht bis zu den Tests» unterscheiden — ein fehlgeschlagenes
# `pip install` sieht genauso aus wie ein gebrochener Vertrag mit der Quelle.
# Beides gehört gesehen, nur das Erste gehört gefixt, und ein Issue, das für
# beides aufgeht, wird nach der zweiten Woche nicht mehr angeschaut.
#
# Deshalb wird der Exit-Code von pytest ausgewertet, nicht der des Jobs:
#
#   0        alle Live-Tests grün          -> clear   (offenes Issue schliessen)
#   1        Tests sind gefallen           -> finding (Issue öffnen/aktualisieren)
#   5        NICHTS EINGESAMMELT           -> unknown (nichts am Issue tun)
#   2,3,4    pytest selbst kam nicht durch -> unknown (nichts am Issue tun)
#
# Die 5 ist die wichtigste Zeile. Benennt jemand die Marke um oder verschiebt
# die Tests, sammelt `-m live` null Tests ein und pytest meldet Erfolg. Ein
# Workflow, der das als grün bucht, hat sich selbst stillgelegt und sagt es
# niemandem — dieselbe Klasse Ausfall wie ein leeres Suchergebnis, das wie eine
# Antwort aussieht.
#
# Ein `unknown` schliesst nie ein Issue. Zuzumachen hiesse zu behaupten, der
# Vergleich sei gelaufen; er ist es nicht.
#
# UND EIN SONDENMODUS
# -------------------
# Von Hand lässt sich ein `-k`-Ausdruck mitgeben, um einen einzelnen Test zu
# isolieren. Ein solcher Lauf berührt das Issue nie — auch nicht, wenn er
# grün ist. Aus demselben Grund wie die 5 oben: Ein Teil der Suite, der
# durchläuft, ist keine Suite, die durchgelaufen ist.

name: Live-Tests

on:
  schedule:
    # Wöchentlich, Montag früh. Die ungerade Minute ist Absicht: Auf :00 legt
    # GitHub die Läufe der halben Welt, und ein verzögerter Cron ist ein Cron,
    # der bei Last auch mal ausfällt.
    - cron: "23 5 * * 1"
  # Damit die Suite nach einem Hinweis auf eine Änderung bei BISTA sofort von
  # Hand laufen kann, statt bis Montag zu warten.
  workflow_dispatch:
    inputs:
      k:
        description: >-
          pytest -k Ausdruck, um einen einzelnen Live-Test zu isolieren
          (leer = ganze Suite). Ein gefilterter Lauf berührt das Issue nie.
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live-Suite gegen bista.zh.ch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"

      # `continue-on-error`, damit der Auswertungsschritt in jedem Fall läuft.
      # Rot wird der Job weiter unten, aus dem ausgewerteten Ergebnis.
      #
      # DER FILTER
      # ----------
      # Am 8.8.2026 fiel derselbe Test in drei Läufen hintereinander mit einem
      # TLS-Hostname-Mismatch, während die Diagnose eine Sekunde später ein
      # gültiges Zertifikat sah. Immer derselbe Test, immer der letzte im
      # Lauf — zu regelmässig für eine flatternde Quelle. Die Frage, die das
      # entscheidet, ist eine Reihenfolge-Frage, und sie lässt sich nur
      # stellen, wenn ein einzelner Test allein laufen kann.
      #
      # `K` kommt über `env` in die Shell, nicht über `${{ }}` in den
      # Quelltext. Ein Ausdruck aus dem Eingabefeld ist Text, den jemand
      # anderes bestimmt; direkt eingesetzt wäre er ausführbarer Code.
      - name: Live-Suite
        id: suite
        continue-on-error: true
        env:
          K: ${{ inputs.k }}
        run: |
          set +e
          args=(tests/ -m live -v)
          if [ -n "$K" ]; then
            args+=(-k "$K")
            echo "filtered=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Gefilterter Lauf::-k '$K' — dieser Lauf ist eine Sonde und fasst das Issue nicht an"
          else
            echo "filtered=false" >> "$GITHUB_OUTPUT"
          fi
          PYTHONPATH=src pytest "${args[@]}" 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Ergebnis einordnen
        id: verdict
        run: |
          code="${{ steps.suite.outputs.pytest_exit }}"
          case "$code" in
            0) state=clear   ;;
            1) state=finding ;;
            5) state=unknown ; reason="pytest hat unter -m live NULL Tests eingesammelt — die Marke oder die Dateien haben sich bewegt, und ein Erfolg ohne Test ist kein Erfolg" ;;
            *) state=unknown ; reason="pytest kam nicht bis zu einem Testergebnis (Exit $code)" ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "::notice title=Live-Suite::$state (pytest exit $code)"

          # Die letzten Zeilen der Ausgabe wandern ins Issue. Ohne sie muss
          # jemand erst den Lauf öffnen, um zu sehen, WELCHER Test gefallen
          # ist — und die Log-Aufbewahrung von Actions ist kürzer als die
          # Lebensdauer eines Issues.
          {
            echo "tail<<PYTEST_TAIL"
            tail -n 40 live-output.txt || true
            echo "PYTEST_TAIL"
          } >> "$GITHUB_OUTPUT"

      # WARUM DIESER SCHRITT EXISTIERT
      # ------------------------------
      # Am 8.8.2026 fielen zwei Läufe hintereinander, und der Grund war aus
      # dem Log allein nicht zu klären. Lauf 1 sah zehnmal `502 Bad Gateway`,
      # Lauf 2 sah stattdessen dreizehn Timeouts — und beide Male endete ein
      # Verbindungsversuch mit
      #
      #     certificate is not valid for 'www.bista.zh.ch'
      #
      # Eine Nachmessung von aussen widersprach dem scheinbar: sauberes TLS,
      # sauberer 502. Sie war wertlos, und das ist die Lehre, die diesen
      # Schritt bezahlt hat: Jene Messung lief über einen Proxy, der TLS
      # terminiert und neu signiert (`remote_ip=127.0.0.1`). Sie hat nie das
      # Zertifikat der Quelle gesehen. Ein Messpunkt, der die Frage gar nicht
      # erreichen kann, beantwortet sie auch nicht — er sieht nur so aus.
      #
      # Der Runner spricht direkt mit der Quelle. Er ist damit der einzige
      # Ort, an dem sich feststellen lässt, WAS dort antwortet. Also stellt
      # er es fest, solange der Ausfall noch läuft: eine Diagnose, die erst
      # beim Nachlesen des Issues von Hand nachgeholt wird, misst einen
      # anderen Zustand als den, der das Issue erzeugt hat.
      #
      # JE ADRESSE, NICHT EINMAL PRO NAME
      # ---------------------------------
      # Löst der Name auf mehrere Adressen auf und ist nur eine davon kaputt,
      # trifft ein einzelnes `openssl s_client -connect <name>:443` mit hoher
      # Wahrscheinlichkeit eine gesunde und meldet «alles in Ordnung». Das ist
      # dieselbe Klasse Ausfall, gegen die diese Suite geschrieben ist: ein
      # Ergebnis, das wie eine Antwort aussieht. Deshalb wird jede aufgelöste
      # Adresse einzeln angesprochen, mit SNI und Hostnamen-Prüfung.
      #
      # AUCH BEI EINEM FELDNAMEN-BEFUND
      # -------------------------------
      # Der Schritt läuft bei jedem Ausgang ausser `clear`, also auch dann,
      # wenn ein Feldname gewandert ist und mit der Verbindung alles stimmt.
      # Das ist Absicht: «Quelle erreichbar, Zertifikat gültig, Endpunkte
      # antworten mit 200» ist die Negativkontrolle, die einen echten
      # Vertragsbruch von einem Ausfall trennt. Sie steht dann eingeklappt im
      # Issue und kostet nichts.
      #
      # Der Schritt darf das Verdikt nicht anfassen. `continue-on-error` plus
      # Zeitlimits an jedem Aufruf: Eine Diagnose, die den Job hängen lässt,
      # hat aus einem gemeldeten Ausfall einen unbemerkten gemacht.
      - name: Verbindung diagnostizieren
        id: diagnose
        if: steps.verdict.outputs.state != 'clear'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          host="$(python -c 'from urllib.parse import urlsplit
          from zh_education_mcp.constants import BISTA_API
          print(urlsplit(BISTA_API).hostname)')"
          base="$(python -c 'from zh_education_mcp.constants import BISTA_API
          print(BISTA_API)')"

          # Die Endpunktliste kommt aus `_READ_FIELDS` und nicht aus dieser
          # Datei. Eine hier abgeschriebene Liste veraltet still; jene ist die,
          # gegen die der Server wirklich liest, und `test_read_fields.py`
          # hält sie vollständig.
          endpoints="$(python -c 'from zh_education_mcp.data import _READ_FIELDS
          print("\n".join(sorted(_READ_FIELDS)))')"

          {
            echo "Vom Runner aus gemessen, $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Auflösung"
            ips="$(getent ahosts "$host" | awk '{print $1}' | sort -u)"
            if [ -z "$ips" ]; then
              echo "$host löst auf nichts auf."
            else
              echo "$ips"
            fi
            echo
            echo "## Zertifikat je Adresse (SNI: $host)"
            for ip in $ips; do
              echo
              echo "### $ip"
              # Streng: schlägt fehl, wenn der Name nicht zum Zertifikat passt.
              # Genau diese Zeile ist die Frage, für die es den Schritt gibt.
              if timeout 20 openssl s_client -connect "[$ip]:443" \
                   -servername "$host" -verify_hostname "$host" \
                   -verify_return_error -brief </dev/null >/dev/null 2>&1; then
                echo "Hostnamen-Prüfung: BESTANDEN"
              else
                echo "Hostnamen-Prüfung: FEHLGESCHLAGEN"
              fi
              # Nachsichtig, nur um zu zeigen, WAS geliefert wurde. Ohne den
              # zweiten Aufruf sagt ein Fehlschlag oben nicht, welcher Name
              # stattdessen im Zertifikat steht — und das ist die Auskunft,
              # die den Ausfall erklärt.
              timeout 20 openssl s_client -connect "[$ip]:443" \
                -servername "$host" </dev/null 2>/dev/null \
                | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 \
                || echo "(kein Zertifikat erhalten)"
            done
            echo
            # Damit diese Auskunft nicht dieselbe Falle stellt, in die sie
            # nachträglich hineingebaut wurde: Steht unter `issuer` keine
            # öffentliche CA, hat etwas auf dem Weg TLS terminiert und neu
            # signiert. Dann sagt der ganze Abschnitt nichts über die Quelle.
            echo "Lesehinweis: Ist der issuer keine öffentliche CA, wurde die"
            echo "Verbindung unterwegs aufgebrochen — dann gilt nichts hiervon"
            echo "für die Quelle, sondern nur für den Zwischenstopp."
            echo
            echo "## HTTP"
            # Die Startseite trennt «ganzer Host aus» von «nur die API tot» —
            # am 8.8. antwortete sie durchgehend mit 200, während alle sechs
            # Endpunkte 502 lieferten.
            printf '%-56s %s\n' "Startseite" \
              "$(curl -sS -o /dev/null --max-time 30 \
                   -w 'http=%{http_code} tls=%{ssl_verify_result} ip=%{remote_ip}' \
                   "https://$host/" 2>&1 || echo 'Aufruf fehlgeschlagen')"
            for ep in $endpoints; do
              printf '%-56s %s\n' "$ep" \
                "$(curl -sS -o /dev/null --max-time 30 \
                     -w 'http=%{http_code} tls=%{ssl_verify_result} ip=%{remote_ip}' \
                     "$base/$ep" 2>&1 || echo 'Aufruf fehlgeschlagen')"
            done
          } > diagnose.txt 2>&1

          cat diagnose.txt

          # Gedeckelt, weil ein Issue-Körper endlich ist und eine Diagnose,
          # die ihn sprengt, gar nicht ankommt.
          {
            echo "text<<DIAGNOSE"
            head -c 6000 diagnose.txt
            echo
            echo "DIAGNOSE"
          } >> "$GITHUB_OUTPUT"

      # EIN GEFILTERTER LAUF FASST DAS ISSUE NICHT AN
      # ---------------------------------------------
      # Weder öffnend noch schliessend, und das Schliessen ist der Grund.
      # Läuft `-k test_live_bista_api_letzi` grün durch, sagt das nichts über
      # die anderen vierzehn Tests — ein Issue, das daraufhin zugeht,
      # behauptet einen Vergleich, den es nicht gab. Das ist dieselbe
      # Klasse Aussage wie ein leeres Suchergebnis, das wie eine Antwort
      # aussieht, nur eine Ebene höher: ein grüner Lauf, der wie eine Suite
      # aussieht.
      #
      # Die Sonde ist damit sichtbar (roter Job, ::notice, Diagnose im Log)
      # und folgenlos für den Zustand, den das Issue führt.
      - name: Issue öffnen, aktualisieren oder schliessen
        if: steps.suite.outputs.filtered != 'true'
        uses: actions/github-script@v7
        # Über `env`, nicht über `${{ }}` im Skript: Die pytest-Ausgabe ist
        # fremder Text, der in einem JavaScript-Template-Literal landen würde.
        # Ein Backtick oder ein `${` darin bricht das Skript oder führt aus,
        # was in einem Assertion-Fehler stand. `env` reicht denselben Text als
        # Wert durch, nicht als Quelltext.
        # Die Diagnose fällt unter dieselbe Regel, und zwar doppelt: Sie
        # enthält Zertifikatsfelder, also Text, den ein fremder Server
        # bestimmt.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
          LIVE_TAIL: ${{ steps.verdict.outputs.tail }}
          LIVE_DIAGNOSE: ${{ steps.diagnose.outputs.text }}
        with:
          script: |
            const state = process.env.LIVE_STATE;
            const reason = process.env.LIVE_REASON || '';
            const tail = process.env.LIVE_TAIL || '(keine Ausgabe)';
            const diagnose = process.env.LIVE_DIAGNOSE || '';
            // Stabiles Präfix: Danach wird das bestehende Issue erkannt, damit
            // ein zweiter roter Montag den Thread verlängert statt einen
            // zweiten aufzumachen. Zehn Issues zur selben Sache liest niemand.
            const PREFIX = 'Live-Tests gegen BISTA rot';
            const LABEL = 'upstream';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const heute = new Date().toISOString().slice(0, 10);

            // `issues.listForRepo` statt der Such-API: Die Suche hat ein
            // eigenes, knappes Rate-Limit und indexiert verzögert — ein frisch
            // geöffnetes Issue findet sie unter Umständen nicht, und dann legt
            // der nächste rote Montag ein zweites an.
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const open = issues.data.find(
              (i) => !i.pull_request && i.title.startsWith(PREFIX)
            );

            if (state === 'unknown') {
              // Weder öffnen noch schliessen. Der Lauf hat nichts über den
              // Vertrag mit BISTA festgestellt, und ein Issue, das auf so einen
              // Lauf hin zugeht, behauptet einen Vergleich, den es nicht gab.
              // Sichtbar wird es über den roten Job und die ::notice.
              core.warning(`Live-Suite nicht ausgewertet: ${reason}. Am Issue wurde nichts geändert.`);
              return;
            }

            if (state === 'finding') {
              const body = [
                'Die wöchentliche Live-Suite gegen `www.bista.zh.ch` ist rot.',
                '',
                `Lauf: ${run}`,
                '',
                '**Rot heisst hier nicht zwingend «unser Fehler».** Es heisst: Der Vertrag',
                'mit der Quelle hat sich geändert, oder die Quelle ist gerade aus. Beides',
                'gehört gesehen, nur das Erste gehört gefixt — und genau das Erste sehen die',
                'Unit-Tests nicht, weil ihre Fixtures aus derselben Annahme geschrieben sind',
                'wie der Code.',
                '',
                'Hat sich eine Kopfzeile oder ein Wertebereich geändert, sagt',
                '`schema_fields.toml` mit den Sonden aus `mcp-continuous-auditor`, welche',
                'Spalte es war.',
                '',
                '<details><summary>Letzte Zeilen der pytest-Ausgabe</summary>',
                '',
                '```',
                tail,
                '```',
                '',
                '</details>',
                // Die Verbindungsdiagnose vom Runner aus. Sie beantwortet die
                // Frage, die von aussen nicht zu beantworten ist: was diese
                // Adresse geliefert hat, als es rot wurde. Fehlt sie, ist der
                // Diagnoseschritt selbst gescheitert — auch das gehört
                // sichtbar, statt als Abwesenheit durchzugehen.
                ...(diagnose
                  ? ['', '<details><summary>Verbindung vom Runner aus</summary>',
                     '', '```', diagnose, '```', '', '</details>']
                  : ['', '_Die Verbindungsdiagnose hat nichts geliefert — der Schritt selbst ist gescheitert._']),
              ].join('\n');

              if (open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `Wieder rot am ${heute}.\n\n${body}`,
                });
              } else {
                // Das Label anlegen, falls es das Repo noch nicht kennt: Sonst
                // scheitert `issues.create` beim allerersten roten Lauf — genau
                // dann, wenn das Issue gebraucht wird.
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'd93f0b',
                    description: 'Vertrag mit einer externen Quelle betroffen',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo, title: `${PREFIX} (${heute})`, body, labels: [LABEL],
                });
              }
              return;
            }

            // clear — und nur hier wird zugemacht, weil nur hier wirklich
            // verglichen und nichts gefunden wurde.
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number,
                body: `Die Live-Suite ist wieder grün. Lauf: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      # Erst hier wird der Job rot. `clear` ist grün; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt — der
      # Unterschied steht im Log und in der ::notice, nicht im Exit-Code.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        run: |
          echo "Live-Suite: ${{ steps.verdict.outputs.state }}"
          echo "${{ steps.verdict.outputs.reason }}"
          exit 1
