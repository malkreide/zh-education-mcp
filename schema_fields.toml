# ══════════════════════════════════════════════════════════════════════════════
# WAS HIER BEWUSST NICHT STEHT
# ══════════════════════════════════════════════════════════════════════════════
# `fixture = …` fehlt bei allen sechs. Der Grund ist nicht Faulheit: Die
# Fixtures dieses Repos sind keine aufgezeichneten Kopfzeilen, sondern
# handgeschriebene Zeilen in den Tests. Es gibt keine Datei, deren Kopfzeile
# gegen die Quelle gehalten werden könnte, also gibt es nichts zu deklarieren.
# Sobald eine echte CSV-Fixture dazukommt, gehört sie hierher — die Sonde meldet
# dann `FIXTURE_PINS_OLD_HEADER`, sobald sie veraltet, und das ist genau der
# Satz, der 2026-08-03 gefehlt hat.
#
# `ignore = […]` fehlt ebenfalls. Die Korroborations-Regel der Sonde trägt das
# schon: Ein Name wird nur dann als fehlend gemeldet, wenn ein *anderer* Name
# derselben Fundstelle auflöst. Eine Ausnahme, die niemand liest, ist ein
# blinder Fleck; sie kommt dazu, wenn sie gebraucht wird, nicht vorsorglich.
#
# `_parse_count` und `_fetch_csv` in `data.py` sind keine Fundstellen. Sie lesen
# keinen benannten Feldnamen — `_parse_count` nimmt einen bereits ausgelesenen
# Wert entgegen. Eine Fundstelle, die keinen Spaltennamen nennt, ist für beide
# Sonden nichts zu messen, und sie als Fundstelle einzutragen hiesse, Deckung
# zu behaupten, die es nicht gibt.
