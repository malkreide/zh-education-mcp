# schema_fields.toml — die Zuordnung, die `schema_field_probe.py` und
# `value_domain_probe.py` aus `mcp-continuous-auditor` lesen.
#
# Sie beantworten zwei Fragen, die dieser Code über sich selbst nicht
# beantworten kann:
#
#   1. Sind die Feldnamen, die wir aus einer Antwort lesen, die Namen, die
#      BISTA gerade liefert?
#   2. Halten die Spalten, die wir durch `int()`/`float()` schicken, überhaupt
#      Zahlen?
#
# Beide Fragen stehen hier, weil beide schon einmal falsch beantwortet waren —
# am 3. August 2026, und zwar ohne dass irgendein Test rot wurde:
#
#   * Der Code las `r["Schulgemeinde"]`, BISTA lieferte `schulgemeinde`. Das
#     Ergebnis war kein Fehler, sondern eine leere Trefferliste mit «nicht
#     gefunden» — ein Ausfall, der wie eine Antwort aussieht. Vier von sechs
#     Datensätzen, acht Tools.
#   * `int()` auf `anzahl` warf, weil BISTA bei kleinen Fallzahlen aus
#     Datenschutzgründen «1 bis 5» schreibt. 18.6 % der Sek-I-Zeilen.
#
# Beides ist behoben (`_normalise_keys`, `_parse_count`). Diese Datei ist der
# Grund, warum es beim nächsten Mal auffällt, statt Monate zu stehen.
#
# Ausführen:
#   python scripts/schema_field_probe.py --target <dieses Repo>
#   python scripts/value_domain_probe.py --target <dieses Repo>
# aus einem Checkout von malkreide/mcp-continuous-auditor.

# ══════════════════════════════════════════════════════════════════════════════
# WARUM ÜBERALL `normalised = "lower"` STEHT
# ══════════════════════════════════════════════════════════════════════════════
# `data._fetch_csv` legt jede Zeile durch `_normalise_keys`, das die Kopfzeile
# einmal auf Kleinschreibung senkt. Der Rest des Moduls liest deshalb *nicht*
# die Kopfzeile, die über die Leitung kam.
#
# Ohne diese Zeile vergleicht die Sonde unsere Kleinschreibung gegen
# `Stand,Kanton,Jahr,…` und meldet Treffer, die keine sind — und begräbt darunter
# den einen, der echt ist. Deklariert wird gegen die transformierte Kopfzeile
# verglichen; die rohe steht weiterhin im Report, damit er von Hand gegen die
# Quelle prüfbar bleibt.
#
# Nicht zu deklarieren ist die sichere Richtung: eine nicht deklarierte
# Normalisierung erzeugt den Befund trotzdem.

# ══════════════════════════════════════════════════════════════════════════════
# EP_SEK1 — Lernende Sekundarstufe I nach Anforderungstyp
# Kopfzeile am 7.8.2026: stand,kanton,jahr,schulgemeinde,anforderungstyp,anzahl
# ══════════════════════════════════════════════════════════════════════════════
[[dataset]]
id = "sek1_anforderungstyp"
url = "https://www.bista.zh.ch/basicapi/ogd/data_lernende_sekundarstufe_i_anforderungstyp"
format = "csv"
delimiter = ","
normalised = "lower"

# `_parse_count` ist der EINE Ort, an dem aus einer BISTA-Zelle eine Zahl wird.
# Genau deshalb sieht `value_domain_probe` von sich aus nichts: An keiner
# Fundstelle steht mehr `int(r["anzahl"])`. Der Helfer wird darum namentlich
# deklariert. `tolerant = true`, weil er `None` zurückgibt statt zu werfen —
# die Aufrufstellen sind damit abgesichert wie durch ein `try`, und der Anteil
# wird gemessen und ausgewiesen, ohne dass ein Gate rot wird.
[[dataset.coercer]]
name = "_parse_count"
tolerant = true

[[dataset.site]]
file = "src/zh_education_mcp/tools.py"
symbol = "zh_edu_list_schulgemeinden"

[[dataset.site]]
file = "src/zh_education_mcp/tools.py"
symbol = "zh_edu_schulkreis_trend"

[[dataset.site]]
file = "src/zh_education_mcp/tools.py"
symbol = "zh_edu_sek1_profil"

